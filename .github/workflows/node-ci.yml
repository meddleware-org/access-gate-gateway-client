# Node CI for the gateway client: install, dependency audit, type-check, lint, the vectors-are-current check, tests and the declaration build, on Node 26;
# then the tests again on Node 24, the minimum the package declares (`engines`). It runs on every push to main and every pull request. The release workflow
# (npm-publish.yml) repeats the checks on the tagged commit in its own `verify` job.
name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:

# Read-only: CI needs nothing but the checkout.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule; npm, Node and other tools honour it).
env:
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA with the version in a comment (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26 is the fleet baseline (D56).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # `npm ci` installs exactly the lockfile, so CI tests what was reviewed.
      - name: Install dependencies
        run: npm ci

      # High and critical advisories fail the build. This repository does not depend on @meddleware/frontend-config, so it does not use that package's gate
      # (which adds an expiring allow-list); the threshold is the same, and there is no allow-list to keep.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # tsc over src/ and tests/ (the tests are included, so a type error in a test fails here).
      - name: Type-check
        run: npm run type-check

      # eslint with the TypeScript rule set (there are no Vue files in this package).
      - name: Lint JS (eslint)
        run: npm run lint:js

      # vectors.json is generated by scripts/gen-vectors.mjs; this fails if the committed file differs from what the script produces.
      - name: Vectors are current
        run: npm run check:vectors

      # The offline unit tests, including the self-test of the published vectors against the Sui SDK's own verifier.
      - name: Test
        run: npm test

      # The published declarations; failing here means a type that cannot be declared.
      - name: Build (declarations)
        run: npm run build

  # The package declares `engines: node >=24`; this proves the claim by running the tests on that version.
  node24-compat:
    name: Node 24 compatibility (engines >=24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The oldest supported Node, not the baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test on the minimum supported Node
        run: npm test
