name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Lint JS (eslint)
        run: npm run lint:js

      - name: Vectors are current
        run: npm run check:vectors

      - name: Test
        run: npm test

      - name: Build (declarations)
        run: npm run build

  node24-compat:
    name: Node 24 compatibility (engines >=24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test on the minimum supported Node
        run: npm test
